:root{--font:'Baloo 2',system-ui,sans-serif;--emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;--tray:120px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#a3d48c;font-family:var(--font);touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#title{position:fixed;left:14px;top:calc(10px + env(safe-area-inset-top));background:rgba(255,255,255,.88);border-radius:22px;padding:2px 18px;font-weight:800;font-size:22px;color:#3d5f2a;box-shadow:0 3px 10px rgba(0,0,0,.12);pointer-events:none}
#btns{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;flex-wrap:wrap-reverse;gap:10px;max-height:calc(100% - var(--tray) - 24px - env(safe-area-inset-bottom));align-content:flex-start}
.b{width:58px;height:58px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.12);font-size:28px;font-family:var(--emoji);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;touch-action:manipulation;color:#333}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.b.on{background:#ffd23f}

<script>
'use strict';
// ================= model =================
const DX=[0,1,0,-1], DY=[-1,0,1,0];
const MID=[[.5,0],[1,.5],[.5,1],[0,.5]];
const PI=Math.PI, HP=PI/2;
const T={
  rovna:  {n:'Rovná',      say:'Rovná kolej',        p:[[0,2]]},
  oblouk: {n:'Oblouk',     say:'Oblouk',             p:[[2,1]]},

  vyhL:   {n:'Výhybka',    say:'Výhybka doleva',     p:[[2,0],[2,3]], lv:[.82,.22], sw:1},
  vyhY:   {n:'Výhybka Y',  say:'Výhybka Ypsilon',    p:[[2,1],[2,3]], lv:[.5,.2], sw:1},
  vyh3:   {n:'Trojitá',    say:'Trojitá výhybka, tři cesty', p:[[2,0],[2,1],[2,3]], lv:[.84,.16], sw:1},
  kriz:   {n:'Křížení',    say:'Křížení',            p:[[0,2],[1,3]]},
  most:   {n:'Most',       say:'Most přes koleje',   p:[[1,3],[0,2,1]], up:1},
  reka:   {n:'Přes řeku',  say:'Most přes řeku',     p:[[0,2]]},
  tunel:  {n:'Tunel',      say:'Tunel',              p:[[0,2]], up:1, tun:1},
  tunelO: {n:'Oblý tunel', say:'Tunel v oblouku',    p:[[2,1]], up:1, tun:1},
  nadrazi:{n:'Nádraží',    say:'Nádraží',            p:[[0,2]], stop:2.8},
  vodarna:{n:'Vodárna',    say:'Vodárna. Tady se mašinka napije.', p:[[0,2]], stop:2.3},
  prejezd:{n:'Přejezd',    say:'Přejezd se závorami', p:[[0,2]], up:1},
  semafor:{n:'Semafor',    say:'Semafor. Červená stůj, zelená jeď.', p:[[0,2]], up:1, lv:[.15,.5], lvR:.22},
  tocna:  {n:'Točna',      say:'Točna. Ťukni a otoč ji.', p:[[0,2],[1,3]], lv:[.5,.5], lvR:.5, only:1},
  mycka:  {n:'Myčka',      say:'Myčka na vláčky',    p:[[0,2]], up:1},
  konec:  {n:'Zarážka',    say:'Zarážka, konec koleje', p:[[0,-1]]},
};
const KOLEJE=['rovna','oblouk','vyhP','vyhL','vyhY','vyh3','kriz','most','reka','tunel','tunelO','nadrazi','vodarna','prejezd','semafor','tocna','mycka','konec'];
const KRAJINA=[['🌳','strom'],['🌲','smrček'],['🏡','domeček'],['🏠','chaloupka'],['🏰','hrad'],['🐄','kravička'],['🐑','ovečka'],['🐴','koník'],['🐓','kohoutek'],['🐶','pejsek'],['🌻','slunečnice'],['🌷','tulipán'],['⛲','kašna'],['🌉','most do města']];
const ZVIRATA=new Set(['🐄','🐑','🐴','🐓','🐶']);
const VLAKY=[
  {id:'c', n:'Červená mašinka', col:'#e5483d', cars:['L','pas','pas']},
  {id:'m', n:'Modrý nákladák',  col:'#2f7de1', cars:['L','uhli','klady']},
  {id:'z', n:'Zelený vláček',   col:'#2fa84f', cars:['L','bedna','bedna','bedna']},
  {id:'y', n:'Žlutá rychlovka', col:'#f0b000', cars:['L','pas'], sp:1.35},
];
const GAP=.43;
const tiles=new Map();
let decor=[], trains=[], parts=[];
const lastRot={};
function K(x,y){return x+','+y}
function edgeSet(t,r){const s=new Set();for(const p of T[t].p){s.add((p[0]+r)%4);if(p[1]>=0)s.add((p[1]+r)%4)}return s}
function plen(p){return p[1]<0?.6:((p[0]+2)%4===p[1]?1:PI/4)}
function cornerOf(a,b){const s=a<b?a*10+b:b*10+a;return s===1?[1,0]:s===12?[1,1]:s===23?[0,1]:[0,0]}
function nrm(d){while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d}
function deadEnd(a){const A=MID[a];return [A[0]+(.5-A[0])*1.2,A[1]+(.5-A[1])*1.2]}
function pathPt(a,b,t){
  const A=MID[a];
  if(b<0){const e=deadEnd(a);return [A[0]+(e[0]-A[0])*t,A[1]+(e[1]-A[1])*t,Math.atan2(e[1]-A[1],e[0]-A[0])]}
  const B=MID[b];
  if((a+2)%4===b)return [A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,Math.atan2(B[1]-A[1],B[0]-A[0])];
  const c=cornerOf(a,b),aA=Math.atan2(A[1]-c[1],A[0]-c[0]),d=nrm(Math.atan2(B[1]-c[1],B[0]-c[0])-aA),an=aA+d*t;
  return [c[0]+.5*Math.cos(an),c[1]+.5*Math.sin(an),an+(d>0?HP:-HP)];
}
function rotPt(x,y,r){let u=x-.5,v=y-.5;for(let i=0;i<r;i++){const w=u;u=-v;v=w}return [u+.5,v+.5]}
function segLen(s){return plen(T[s.t].p[s.pi])}
function flip(s){return {x:s.x,y:s.y,t:s.t,r:s.r,pi:s.pi,rev:!s.rev}}
function segPoint(s,off){
  const p=T[s.t].p[s.pi],L=plen(p);let t=Math.max(0,Math.min(1,off/L));if(s.rev)t=1-t;
  let [x,y,an]=pathPt(p[0],p[1],t);if(s.rev)an+=PI;
  const q=rotPt(x,y,s.r);
  return {x:s.x+q[0],y:s.y+q[1],a:an+s.r*HP,layer:p[2]||0,seg:s,off,L};
}
function nextSeg(s){
  const p=T[s.t].p[s.pi];let e=s.rev?p[0]:p[1];if(e<0)return null;e=(e+s.r)%4;
  const nx=s.x+DX[e],ny=s.y+DY[e],tl=tiles.get(K(nx,ny));if(!tl)return null;
  const en=(e+2)%4,c=[];
  T[tl.t].p.forEach((q,i)=>{const a=(q[0]+tl.r)%4,b=q[1]<0?-1:(q[1]+tl.r)%4;if(a===en)c.push([i,false]);else if(b===en)c.push([i,true])});
  if(T[tl.t].only){const a=c.filter(q=>q[0]===(tl.s||0)%2);if(!a.length)return null;return {x:nx,y:ny,t:tl.t,r:tl.r,pi:a[0][0],rev:a[0][1]}}
  if(!c.length)return null;
  const ch=c.length>1?c[(tl.s||0)%c.length]:c[0];
  return {x:nx,y:ny,t:tl.t,r:tl.r,pi:ch[0],rev:ch[1]};
}
// ================= trains =================
function trainLen(tr){return (tr.cars.length-1)*GAP}
function locate(tr,d){
  if(d<=tr.h)return {i:0,off:tr.h-d};
  d-=tr.h;
  for(let i=1;i<tr.segs.length;i++){const L=segLen(tr.segs[i]);if(d<=L)return {i,off:L-d};d-=L}
  return {i:tr.segs.length-1,off:0};
}
function reverseTrain(tr){
  const {i,off}=locate(tr,trainLen(tr)),L=segLen(tr.segs[i]);
  tr.segs=tr.segs.slice(0,i+1).reverse().map(flip);tr.h=L-off;tr.revd=!tr.revd;tr.stKey=null;
}
function trim(tr){const D=trainLen(tr);let cum=tr.h,k=1;while(k<tr.segs.length&&cum<D+.01){cum+=segLen(tr.segs[k]);k++}tr.segs.length=k}
function fillBack(tr){
  const D=trainLen(tr);let tmp=flip(tr.segs[0]),tot=tr.h;const back=[];
  while(tot<D+.05&&back.length<20){const n=nextSeg(tmp);if(!n)break;back.push(n);tot+=segLen(n);tmp=n}
  tr.segs=[tr.segs[0],...back.map(flip)];
}
function makeTrain(def,key){
  const tl=tiles.get(key),[x,y]=key.split(',').map(Number);
  const seg={x,y,t:tl.t,r:tl.r,pi:0,rev:false};
  const tr={def,cars:def.cars,segs:[seg],h:segLen(seg)*.5,revd:false,stop:0,bump:0,jump:0,smokeT:0,stKey:K(x,y),pos:[],tunT:0};
  fillBack(tr);computePos(tr);return tr;
}
function computePos(tr){
  const D=trainLen(tr);
  for(let k=0;k<tr.cars.length;k++){const d=tr.revd?D-k*GAP:k*GAP;const L=locate(tr,d);tr.pos[k]=segPoint(tr.segs[L.i],L.off)}
  tr.head=segPoint(tr.segs[0],tr.h);
}
let speedIx=1;const SPEEDS=[.75,1.25,2.1],SPICO=['🐢','🚂','🐇'],SPSAY=['Pomaličku','Normálně','Rychle jako zajíc'];
function stepTrain(tr,dt){
  if(tr.bump>0)tr.bump-=dt;
  if(tr.stop>0){tr.stop-=dt;if(tr.stop<=0)SND.houk(.6);return}
  const mv=SPEEDS[speedIx]*(tr.def.sp||1)*dt,f0=tr.segs[0];
  if(f0.t==='semafor'){const st=tiles.get(K(f0.x,f0.y));if(st&&st.s===1&&tr.h<=.3+1e-6&&tr.h+mv>.3){tr.h=.3;tr.wait=true;return}}
  tr.wait=false;
  tr.h+=mv;
  let g=0;
  while(tr.h>=segLen(tr.segs[0])&&g++<8){
    const n=nextSeg(tr.segs[0]);
    if(n){tr.h-=segLen(tr.segs[0]);tr.segs.unshift(n);onEnter(tr,n)}
    else{tr.h=segLen(tr.segs[0]);reverseTrain(tr);break}
  }
  trim(tr);
  const s0=tr.segs[0],k=K(s0.x,s0.y);
  if(T[s0.t].stop){if(tr.stKey!==k&&tr.h>=segLen(s0)*.5){tr.stKey=k;tr.stop=T[s0.t].stop;stationEvent(tr,s0)}}
  else if(tr.stKey&&tr.stKey!==k&&!tr.segs.some(s=>K(s.x,s.y)===tr.stKey))tr.stKey=null;
}
let lastTunelHouk=0;
function onEnter(tr,n){
  if(T[n.t].tun&&now-lastTunelHouk>4){lastTunelHouk=now;SND.houk(.5)}
  if(n.t==='mycka'){tr.wash=1.1;SND.splash();if(now-lastStSay>14&&Math.random()<.6){lastStSay=now;rekni(vyber(MYCKA))}}
}
function headOf(tr){return tr.head}
function collisions(){
  for(const A of trains){
    if(A.bump>0||A.stop>0)continue;const h=A.head;
    outer:for(const B of trains){if(B===A)continue;
      for(const p of B.pos){if(p.layer!==h.layer)continue;
        if((p.x-h.x)**2+(p.y-h.y)**2<.34*.34){reverseTrain(A);A.bump=1.3;SND.bum();burst(h.x,h.y,6,'#fff');break outer}}}
  }
}
function validate(){
  const re=[];
  trains=trains.filter(tr=>{
    if(tr.segs.every(s=>{const tl=tiles.get(K(s.x,s.y));return tl&&tl.t===s.t&&tl.r===s.r}))return true;
    const p=tr.pos[0]||tr.head;burst(p.x,p.y,10,'#fff');re.push([tr.def,p]);return false;
  });
  for(const [def,p] of re){const key=nearestTrack(p.x,p.y,true);if(key)trains.push(makeTrain(def,key))}
}
function occupied(x,y){return trains.some(tr=>tr.segs.some(s=>s.x===x&&s.y===y))}
function nearestTrack(wx,wy,avoid){
  let best=1e9,key=null;
  for(const [k,tl] of tiles){if(tl.t==='konec')continue;const [x,y]=k.split(',').map(Number);
    let d=(x+.5-wx)**2+(y+.5-wy)**2;if(avoid&&occupied(x,y))d+=60;if(d<best){best=d;key=k}}
  if(!key)for(const k of tiles.keys()){key=k;break}
  return key;
}
function addTrain(def,cell){
  let key=null;
  if(cell){const k=K(cell[0],cell[1]);if(tiles.has(k))key=k}
  if(!key){const [wx,wy]=toWorld(W/2,(H-trayH())/2);key=nearestTrack(wx,wy,true)}
  if(!key){toast('Nejdřív postav koleje 🛤️');rekni('Nejdřív postav koleje.');return}
  if(trains.length>=6){const o=trains.shift();burst(o.head.x,o.head.y,10,'#fff')}
  const tr=makeTrain(def,key);trains.push(tr);SND.houk();tr.jump=.4;
  rekni(vyber(['Jede '+def.n.toLowerCase()+'!',def.n+' vyjíždí!','Pozor, '+def.n.toLowerCase()+'!',def.n+' je tady!']));
}
const STANICE=['Stanice Davídkov!','Všichni nastupovat!','Pozor, vlak přijíždí.','Cestující vystupují.','Nádraží, zastavujeme!','Lístky, prosím!','Mávej, vlak odjíždí!','Kdo pojede s námi?','Nastupujte, jedeme na výlet!','Vlak zastavil, ding dong!','Pejsek taky jede?','Příští stanice Davídkov!'];
let lastStSay=-99;
const paxMap=new Map();const PAX=['🧒','👧','👦','👵','👴','👩','👨','🐶','🐱','🐻','🐰','🦊'];
const MYCKA=['Myjeme mašinku!','Bublinky, bublinky!','Šup do myčky!','Mašinka je čistá jako klícka.','Kartáče točí, šrub šrub!','Pozor, bude mokro!','Teď se vláček vykoupe.'];
const VODA=['Mašinka má žízeň.','Glo glo glo, mašinka pije vodu.','Doplňujeme vodu!','Ššš, voda teče.','Mašinka se napila, jedeme!','Bez vody by parní mašinka nejela.'];
function stationEvent(tr,s){
  if(s.t==='vodarna'){SND.splash();const q=rotPt(.56,.3,s.r),x=s.x+q[0],y=s.y+q[1];
    for(let k=0;k<6;k++)setTimeout(()=>{for(let i=0;i<4;i++)parts.push({x:x+(Math.random()-.5)*.08,y,vx:(Math.random()-.5)*.1,vy:.25+Math.random()*.2,r:.025,g:.02,life:.7,max:.7,col:'#5ab8ee'})},k*250);
    if(now-lastStSay>14){lastStSay=now;setTimeout(()=>rekni(vyber(VODA)),500)}return}

  const k=K(s.x,s.y),px=paxMap.get(k);if(px){px.b=1.2;setTimeout(()=>{px.ch=vyber(PAX);px.b=.6},1300)}

// ================= audio & voice =================
let zvuk=true,AC=null,NB=null;

function tone(f,d,type,v,w,f2){const a=zvuk&&ac();if(!a)return;const t=a.currentTime+(w||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.008,v||.2,d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}

  const t=a.currentTime+(w||0),s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1000;f.Q.value=.8;const g=a.createGain();env(g,t,.006,v||.2,d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.05)}
const SND={

function score(t,r,cx,cy){

    const mine=E.has(d),nh=edgeSet(n.t,n.r).has((d+2)%4);
    if(mine&&nh)sc+=3;else if(mine||nh)sc-=1}
  return sc}
function conn(x,y){const tl=tiles.get(K(x,y));let c=0;for(const d of edgeSet(tl.t,tl.r)){const n=tiles.get(K(x+DX[d],y+DY[d]));if(n&&edgeSet(n.t,n.r).has((d+2)%4))c++}return c}

function setTile(t,cx,cy,r,anim,s){tiles.set(K(cx,cy),{t,r,s:s||0,ra:r*HP,rt:r*HP,pop:anim?0:1,sa:(s||0)*HP,st:(s||0)*HP,bv:0})}

    let tot=score(t,r,cx,cy);const nrs=[];
    for(const [x,y,n] of lone){let bR=n.r,bS=score(n.t,n.r,x,y);for(let j=1;j<4;j++){const q=(n.r+j)%4,sc=score(n.t,q,x,y);if(sc>bS){bS=sc;bR=q}}nrs.push(bR);tot+=bS}
    if(!best||tot>best.tot)best={r,tot,nrs}}

  lastRot[t]=best.r;SND.klap();
}

  velka:{n:'Velká trať',t:[[0,0,'oblouk',0],[1,0,'rovna',1],[2,0,'tunel',1],[3,0,'rovna',1],[4,0,'rovna',1],[5,0,'oblouk',1],[5,1,'reka',0],[5,2,'rovna',0],[5,3,'oblouk',2],[4,3,'rovna',1],[3,3,'nadrazi',1],[2,3,'rovna',1],[1,3,'vyhP',3],[0,3,'oblouk',3],[0,2,'rovna',0],[0,1,'rovna',0],[1,2,'rovna',0],[1,1,'konec',2]],
    d:[['🏡',2.7,1.55],['🐄',3.8,2.45],['🌳',4.45,1.35],['🌻',2.45,2.5],['🌲',-.55,.5],['🌲',6.55,2.6],['🐑',6.5,.7]]},
  oval:{n:'Ovál s nádražím',t:[[0,0,'oblouk',0],[1,0,'rovna',1],[2,0,'rovna',1],[3,0,'rovna',1],[4,0,'oblouk',1],[4,1,'rovna',0],[4,2,'oblouk',2],[3,2,'nadrazi',1],[2,2,'rovna',1],[1,2,'rovna',1],[0,2,'oblouk',3],[0,1,'rovna',0]],
    d:[['🌳',1.6,1.45],['🐑',2.6,1.5],['🌷',3.5,1.55]]},
  osm:{n:'Osmička s mostem',t:[[1,1,'most',0],[1,0,'oblouk',0],[2,0,'oblouk',1],[2,1,'oblouk',2],[1,2,'oblouk',2],[0,2,'oblouk',3],[0,1,'oblouk',0]],
    d:[['🌲',2.5,2.5],['🐴',.5,.5]]},
  vylet:{n:'Výlet se semaforem',t:[[0,0,'tunelO',0],[1,0,'rovna',1],[2,0,'mycka',1],[3,0,'rovna',1],[4,0,'oblouk',1],[4,1,'semafor',0],[4,2,'oblouk',2],[3,2,'vodarna',1],[2,2,'prejezd',1],[1,2,'rovna',1],[0,2,'oblouk',3],[0,1,'rovna',0]],
    d:[['🐄',1.5,1.45],['🌳',3.3,1.4],['🐶',2.5,3.3]]},
  dva:{n:'Dva okruhy',t:[[0,0,'oblouk',0],[1,0,'rovna',1],[2,0,'oblouk',1],[2,1,'vyhP',0],[2,2,'oblouk',2],[1,2,'tunel',1],[0,2,'oblouk',3],[0,1,'rovna',0],[3,1,'rovna',1],[4,0,'oblouk',0],[5,0,'rovna',1],[6,0,'oblouk',1],[6,1,'rovna',0],[6,2,'oblouk',2],[5,2,'nadrazi',1],[4,2,'oblouk',3],[4,1,'vyhL',0]],
    d:[['🏰',1.5,1.45],['🐓',5.5,1.5],['🌳',3.5,2.5]]},
};
function placeTpl(key,bx,by){const tp=TPL[key];for(const [x,y,t,r] of tp.t)setTile(t,bx+x,by+y,r,true);for(const [k,x,y] of tp.d)decor.push({k,x:bx+x,y:by+y,b:.6})}
function addTpl(key){
  const tp=TPL[key];snap();
  let w=0,h=0;for(const [x,y] of tp.t){w=Math.max(w,x+1);h=Math.max(h,y+1)}
  const [cx,cy]=toWorld((W-70)/2,(H-trayH())/2);const bx=Math.round(cx-w/2),by=Math.round(cy-h/2);
  const free=(ax,ay)=>tp.t.every(([x,y])=>{for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)if(tiles.has(K(ax+x+i,ay+y+j)))return false;return true});
  let pos=null;
  for(let rad=0;rad<25&&!pos;rad++)for(let i=-rad;i<=rad&&!pos;i++)for(let j=-rad;j<=rad&&!pos;j++){if(Math.max(Math.abs(i),Math.abs(j))!==rad)continue;
    const ax=bx+i*(w+1),ay=by+j*(h+1);if(free(ax,ay))pos=[ax,ay]}
  if(!pos)pos=[bx,by];
  placeTpl(key,pos[0],pos[1]);SND.klap();setTimeout(SND.klap,120);commit();
  fitBox([pos[0],pos[1],pos[0]+w,pos[1]+h],true,Math.max(S,90));
  rekni(vyber(['Hotovo! '+tp.n+'.','Tady je '+tp.n.toLowerCase()+'.','Postaveno!']));
}
function tplPreview(key){
  const tp=TPL[key];let w=0,h=0;for(const [x,y] of tp.t){w=Math.max(w,x+1);h=Math.max(h,y+1)}
  const c=document.createElement('canvas'),d=Math.min(window.devicePixelRatio||1,2.5),cw=170,ch=110;c.width=cw*d;c.height=ch*d;const x=c.getContext('2d');
  const s=Math.min((cw-10)/w,(ch-10)/h);x.setTransform(d*s,0,0,d*s,d*(cw-w*s)/2,d*(ch-h*s)/2);
  const tl={};for(const L of [0,1])for(const [a,b,t,r] of tp.t)drawTile(x,{t,r,s:0,ra:r*HP,pop:1},a,b,L);
  return c}
function openTpl(){
  const box=$('tpls');box.innerHTML='';
  for(const k of Object.keys(TPL)){const b=document.createElement('button');b.className='tp';b.appendChild(tplPreview(k));b.appendChild(document.createTextNode(TPL[k].n));
    b.onclick=()=>{closeTpl();addTpl(k)};box.appendChild(b)}
  $('mClear').classList.remove('sure');$('mClear').textContent='🧹 Začít znovu';
  $('modal').classList.add('on');rekni('Vyber si hotovou trať.');
}
function closeTpl(){$('modal').classList.remove('on')}
$('bTpl').onclick=openTpl;$('mClose').onclick=closeTpl;$('mOk').onclick=closeTpl;
$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeTpl()});
let clearT=null;
$('mClear').onclick=()=>{const b=$('mClear');
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Opravdu? Ťukni znovu';clearTimeout(clearT);clearT=setTimeout(()=>{b.classList.remove('sure');b.textContent='🧹 Začít znovu'},3500);return}
  snap();tiles.clear();decor=[];trains=[];paxMap.clear();commit();closeTpl();SND.puf();fitBox(null,true);toast('Čistá louka – stav!');rekni('Čistá louka. Můžeš stavět.')};
// ================= loop =================
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;now=t/1000;
  for(const tl of tiles.values()){if(tl.ra!==tl.rt){tl.ra+=(tl.rt-tl.ra)*Math.min(1,dt*16);if(Math.abs(tl.rt-tl.ra)<.001)tl.ra=tl.rt}if(tl.pop<1)tl.pop=Math.min(1,tl.pop+dt*3.2)}
  if(!paused)for(const tr of trains)stepTrain(tr,dt);
  for(const tr of trains){computePos(tr);if(tr.jump>0)tr.jump-=dt;
    if(!paused&&tr.stop<=0&&!tr.wait){tr.smokeT-=dt;if(tr.smokeT<=0){tr.smokeT=.32/SPEEDS[speedIx];smoke(tr)}}}
  if(!paused)collisions();
  for(const [k,tl] of tiles){
    if(tl.t==='tocna'&&tl.sa!==tl.st){tl.sa+=(tl.st-tl.sa)*Math.min(1,dt*5);if(Math.abs(tl.st-tl.sa)<.002)tl.sa=tl.st}
    if(tl.t==='prejezd'){const i=k.indexOf(','),x=+k.slice(0,i)+.5,y=+k.slice(i+1)+.5;
      const near=trains.some(tr=>tr.pos.some(p=>p&&(p.x-x)**2+(p.y-y)**2<1.35*1.35));
      if(near&&!tl.down){tl.down=true;SND.zvonek()}else if(!near)tl.down=false;
      tl.bv+=((near?1:0)-tl.bv)*Math.min(1,dt*4)}}
  for(const tr of trains)if(tr.wash>0){tr.wash-=dt;const h=tr.head;if(Math.random()<.7)parts.push({x:h.x+(Math.random()-.5)*.5,y:h.y+(Math.random()-.5)*.4,vx:(Math.random()-.5)*.15,vy:-.12-Math.random()*.15,r:.025+Math.random()*.035,g:.03,life:1.1,max:1.1,col:vyber(['#ffffff','#cdeeff','#ffd6ea','#fff4b8','#d9ffd6'])})}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.r+=p.g*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const d of decor)if(d.b>0)d.b-=dt;
  for(const px of paxMap.values())if(px.b>0)px.b-=dt;
  if(viewAnim){const a=viewAnim;a.t=Math.min(1,a.t+dt*2.4);const e=1-Math.pow(1-a.t,3);S=a.s0+(a.s1-a.s0)*e;ox=a.x0+(a.x1-a.x0)*e;oy=a.y0+(a.y1-a.y0)*e;if(a.t>=1)viewAnim=null}
  draw();requestAnimationFrame(frame);
}
// ================= start =================
EMF=getComputedStyle(document.documentElement).getPropertyValue('--emoji').trim()||'sans-serif';
resize();addEventListener('resize',()=>{resize()});
let loaded=null;try{loaded=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(loaded&&loaded.t&&loaded.t.length)restore(loaded);else{placeTpl('velka',0,0);for(const tl of tiles.values())tl.pop=1;for(const d of decor)d.b=0}
fitBox(bbox(),false);
if(tiles.size){const k=tiles.has('2,3')?'2,3':nearestTrack(0,0,false);if(k)trains.push(makeTrain(VLAKY[0],k))}
renderTray();updBtns();requestAnimationFrame(frame);
</script>
